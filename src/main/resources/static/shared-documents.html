<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared with Me | TrustVault</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7fc;color:#172641;margin:0}.top{background:#102347;color:white;padding:24px 5vw}.top a{color:white}main{max-width:900px;margin:30px auto;padding:0 18px}.item{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#68778d}a.button{background:#315efb;color:white;padding:9px 12px;border-radius:8px;text-decoration:none;margin-left:6px}@media(max-width:650px){.item{display:block}.actions{margin-top:12px}}</style></head><body><div class="top"><h1>Shared with Me</h1><p>Documents that other TrustVault users shared with you</p><a href="/dashboard.html">← Back to dashboard</a></div><main><p id="status">Loading shared documents…</p><div id="list"></div></main><script>async function load(){const list=document.getElementById('list'),status=document.getElementById('status');try{const r=await fetch('/api/shares/with-me',{credentials:'same-origin',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status===401?'Please sign in again.':'Could not load shared documents.');const docs=await r.json();status.textContent=docs.length?`${docs.length} shared document(s)`:'No documents have been shared with you yet.';for(const d of docs){const item=document.createElement('article');item.className='item';const info=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('p');title.textContent=d.filename||'Untitled';meta.className='muted';meta.textContent=`Shared by ${d.owner} · ${d.permission} · ${(Number(d.fileSize||0)/1048576).toFixed(2)} MB`;info.append(title,meta);const actions=document.createElement('div');actions.className='actions';const preview=document.createElement('a');preview.className='button';preview.href='/api/documents/preview/'+encodeURIComponent(d.id);preview.target='_blank';preview.rel='noopener noreferrer';preview.textContent='Preview';const download=document.createElement('a');download.className='button';download.href='/api/documents/download/'+encodeURIComponent(d.id);download.textContent='Download';actions.append(preview,download);item.append(info,actions);list.append(item)}}catch(e){status.textContent=e.message||'Could not load shared documents.'}}load();</script></body></html>
