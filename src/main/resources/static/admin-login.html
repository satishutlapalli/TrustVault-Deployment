
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TrustVault</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #14213d;
            background: linear-gradient(135deg, #edf3ff, #f8fafc);
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: white;
            border: 1px solid #e1e8f0;
            border-radius: 20px;
            box-shadow: 0 18px 50px #14213d12;
        }
        .logo {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            color: white;
            background: #173765;
            font-size: 28px;
        }
        h1 { margin: 22px 0 8px; font-size: 27px; }
        p { color: #64748b; line-height: 1.6; }
        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid #8bb5f5;
            border-color: #3569b7;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            color: white;
            background: #173765;
            border: 0;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #234d85; }
        .message {
            padding: 10px;
            margin-top: 16px;
            border-radius: 8px;
            background: #fff1f2;
            color: #b42318;
            font-size: 14px;
        }
        .hidden { display: none; }
        .links { margin-top: 24px; text-align: center; font-size: 14px; }
        a { color: #285da8; text-decoration: none; }
        .notice { margin-top: 22px; font-size: 12px; }
    </style>
</head>
<body>
<main class="card">
    <div class="logo">◆</div>
    <h1>Administrator sign in</h1>
    <p>Sign in with your authorized TrustVault administrator account.</p>

    <div id="errorMessage" class="message hidden" role="alert">
        <span id="errorText">Unable to sign in.</span>
    </div>

    <form action="/login?loginType=admin" method="post">
        <label for="username">Admin username</label>
        <input id="username" name="username" autocomplete="username"
               required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Login as Admin</button>
    </form>

    <div class="links">
        <a href="/login.html">Login as User</a>
    </div>

    <p class="notice">
        Administrative access is verified by the server.
    </p>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const messages = {
        "not-admin": "This account does not have administrator access.",
        "true": "Login failed. Check your username and password."
    };

    if (error && messages[error]) {
        document.getElementById("errorText").textContent = messages[error];
        document.getElementById("errorMessage").classList.remove("hidden");
    }
</script>
</body>
</html>
