
spring.datasource.url=jdbc:postgresql://localhost:5432/trustvault
spring.datasource.username=trustvault_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
trustvault.upload-dir=${user.home}/TrustVaultUploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.servlet.session.timeout=15m

# Set this to an already-registered username to grant admin access. Leave blank otherwise.
trustvault.admin.username=${TRUSTVAULT_ADMIN_USERNAME:}
